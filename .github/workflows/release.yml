name: Release

# Publishes constellation.plug.js and PLUG.md as a GitHub release, so the library installs with
#   Library: Install → ghr:TeenKode/silverbullet-constellation/PLUG.md
#   • a tag like v1.2.0                                → release v1.2.0 (must match package.json)
#   • run manually with “release” checked (main only)  → the workflow creates tag v<package.json version>
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release v<version from package.json> (main only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$v" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $v"; exit 1
          fi
          if [ "${{ inputs.release }}" = "true" ]; then
            [ "${{ github.ref }}" = "refs/heads/main" ] || { echo "Release only from main"; exit 1; }
            if git ls-remote --tags origin "refs/tags/v$v" | grep -q .; then
              echo "v$v is already released — bump the version in package.json"; exit 1
            fi
          fi
          echo "Version $v"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Check in a real SilverBullet
        run: node scripts/check.mjs
      - name: Publish
        if: github.ref_type == 'tag' || inputs.release
        uses: softprops/action-gh-release@v3
        with:
          name: Constellation ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: |
            constellation.plug.js
            PLUG.md
          body: |
            Install in SilverBullet: run **Library: Install** and enter
            `ghr:TeenKode/silverbullet-constellation/PLUG.md`. Update later with **Library: Update**.
